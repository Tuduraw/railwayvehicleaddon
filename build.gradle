plugins {
	id 'fabric-loom' version "${loom_version}"
}

// jar・Mavenのバージョンにローダー名とMinecraftのバージョンを付ける(railwayvehicleaddon-0.1.2-fabric-1.21.11.jar)。
// MOD自体のバージョン(fabric.mod.json)はmod_versionのまま
version = "${project.mod_version}-${project.mod_loader}-${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// 前提MOD(tudursvehiclemod)はローカルMavenから解決する - Readme_Addon_Mod.md参照
	mavenLocal()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"railwayvehicleaddon" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation "com.example.tudursvehiclemod:tudursvehiclemod:${project.tudursvehiclemod_version}"
}

processResources {
	inputs.property "version", project.mod_version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
