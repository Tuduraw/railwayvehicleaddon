# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Fabric toolchain - 前提MOD(tudursvehiclemod)と完全に一致させること
minecraft_version=1.21.11
loader_version=0.18.2

loom_version=1.14-SNAPSHOT

# Mod properties
mod_version=0.1.2
maven_group=com.example.railwayvehicleaddon
archives_base_name=railwayvehicleaddon
# jarとMavenのバージョンに付ける: railwayvehicleaddon-<mod_version>-<mod_loader>-<minecraft_version>.jar
# (fabric.mod.jsonのバージョンはmod_versionのまま)
mod_loader=fabric

# Dependencies
fabric_version=0.139.4+1.21.11
# 前提MOD。前提MOD側で ./gradlew publishToMavenLocal を実行しておくこと
tudursvehiclemod_version=1.1.1-fabric-1.21.11
